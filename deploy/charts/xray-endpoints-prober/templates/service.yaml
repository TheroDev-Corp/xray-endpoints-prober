apiVersion: v1
kind: Service
metadata:
  name: {{ include "xray-endpoints-prober.fullname" . }}
  labels:
    {{- include "xray-endpoints-prober.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    {{- include "xray-endpoints-prober.selectorLabels" . | nindent 4 }}
